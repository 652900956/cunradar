# ═══════════════════════════════════════════════════════════════
#                    CunRadar 配置文件
#                        Version: 1.0
# ═══════════════════════════════════════════════════════════════

# 基础设置
app:
  timezone: "Asia/Shanghai"
  # 只统计过去 N 小时内发布的内容
  max_item_age_hours: 24

# ─── 关注列表（示例） ──────────────────────────────────────────
# ⚠️ 如果你在公开仓库中使用，建议通过 FOLLOW_CONFIG 环境变量
#    传入真实关注列表（JSON 格式），避免暴露订阅信息。
#
#    本地开发：在 .env 中添加 FOLLOW_CONFIG=...
#    线上部署：在 GitHub Variables 中添加 FOLLOW_CONFIG
#
#    详见 README.md 中的「隐私保护」章节。
#
#    以下是 JSON 格式示例：
#
#    FOLLOW_CONFIG='{
#      "youtube": [
#        {"name": "博主A", "channel_id": "UC..."},
#        {"name": "博主B", "channel_id": "UC..."}
#      ],
#      "bilibili": [
#        {"name": "UP主A", "uid": 123456}
#      ],
#      "rss": [
#        {"name": "博客A", "url": "https://example.com/rss.xml"}
#      ],
#      "github": [
#        {"name": "项目A", "repo": "owner/repo"}
#      ],
#      "github_trending": {
#        "enabled": true,
#        "language": "",
#        "limit": 5
#      }
#    }'
# ────────────────────────────────────────────────────────────────
follow:

  # YouTube 频道
  youtube:
    - name: "示例博主"
      channel_id: "UCxxxxxxxxxxxxxxxxxxxxxxxxxx"

  # B站 UP 主
  bilibili:
    - name: "示例UP主"
      uid: 1234567890

  # RSS / 博客订阅
  rss:
    - name: "示例博客"
      url: "https://example.com/rss.xml"

  # GitHub 项目追踪
  github:
    - name: "示例项目"
      repo: "owner/repo"

  # GitHub Trending
  github_trending:
    enabled: true
    language: ""
    limit: 5

# ─── AI 配置 ───────────────────────────────────────────────────
ai:
  model: "deepseek-chat"              # DeepSeek 模型名
  api_key: "${DEEPSEEK_API_KEY}"      # 从环境变量读取
  api_base: "https://api.deepseek.com"
  timeout: 120

# ─── 通知配置 ─────────────────────────────────────────────────
notification:
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

# ─── 输出配置 ─────────────────────────────────────────────────
output:
  dir: "output"
  # 生成 HTML 日报
  html: true
