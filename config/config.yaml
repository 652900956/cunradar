# ═══════════════════════════════════════════════════════════════
#                    CunRadar 配置文件
#                        Version: 1.0
# ═══════════════════════════════════════════════════════════════

# 基础设置
app:
  timezone: "Asia/Shanghai"
  # 只统计过去 N 小时内发布的内容
  max_item_age_hours: 24

# ─── 关注列表（示例 + 兜底） ─────────────────────────────────
# ⚠️ 如果你在公开仓库中使用，建议通过 FOLLOW_CONFIG 环境变量
#    传入真实关注列表（JSON 格式），避免暴露订阅信息。
#
#    本地开发：在 .env 中添加 FOLLOW_CONFIG=...
#    线上部署：在 GitHub Variables 中添加 FOLLOW_CONFIG
#
#    详见 README.md 中的「隐私保护」章节。
#
#    以下是 JSON 格式示例（使用村长的信息作为演示）：
#
#    FOLLOW_CONFIG='{
#      "youtube": [
#        {"name": "Web3村长", "channel_id": "UC5MbekhrH8iyFBQLbccBSRg"}
#      ],
#      "bilibili": [
#        {"name": "Web3村长Official", "uid": 1224034462}
#      ],
#      "rss": [
#        {"name": "村长博客", "url": "https://cunzhangblog.com/rss.xml"}
#      ],
#      "github": [
#        {"name": "CunRadar", "repo": "cunzhangcrypto/CunRadar"}
#      ],
#      "github_trending": {
#        "enabled": true,
#        "language": "",
#        "limit": 5
#      }
#    }'
# ────────────────────────────────────────────────────────────────
follow:

  # YouTube 频道
  youtube:
    - name: "Web3村长"
      channel_id: "UC5MbekhrH8iyFBQLbccBSRg"

  # B站 UP 主
  bilibili:
    - name: "Web3村长Official"
      uid: 1224034462

  # RSS / 博客订阅
  rss:
    - name: "村长博客"
      url: "https://cunzhangblog.com/rss.xml"

  # GitHub 项目追踪
  github:
    - name: "CunRadar"
      repo: "652900956/CunRadar"

  # GitHub Trending
  github_trending:
    enabled: true
    language: ""
    limit: 5

# ─── AI 配置（多供应商，OpenAI 兼容） ───────────────────────
# provider 可选：deepseek / zhipu / hunyuan / qwen
#   - deepseek: DeepSeek（付费，性价比高）
#   - zhipu:    智谱 GLM-4.7-Flash（免费）
#   - hunyuan:  腾讯混元 Lite（免费；更好的免费档 hunyuan-turbos-latest）
#   - qwen:     通义千问 Qwen3.7 Flash（便宜；若报错改用 qwen3.6-flash / qwen-turbo）
# 也可通过环境变量 AI_PROVIDER / AI_API_KEY / AI_MODEL / AI_BASE_URL 覆盖（优先级最高）
ai:
  provider: "deepseek"                # 默认供应商
  api_key: "${AI_API_KEY}"            # 对应供应商的 API Key（必填）
  # 以下两项留空则使用供应商预设；如需自定义可填写
  api_base: ""                         # 例如 https://api.deepseek.com/v1
  model: ""                            # 例如 deepseek-chat
  timeout: 120

# ─── 通知配置（多通道：飞书 / 企业微信 / 钉钉） ───────────────
# 每个通道只有填了 webhook_url 才会推送；留空则跳过。
# 三家 webhook 均通过环境变量注入（GitHub Secrets / .env），不写死在代码里。
notification:
  # 飞书自定义机器人
  feishu:
    # 飞书群 → 设置 → 群机器人 → 添加机器人，复制 Webhook 地址
    webhook_url: "${FEISHU_WEBHOOK_URL}"
    # 可选：机器人「安全设置」开启「签名校验」时填写
    secret: "${FEISHU_SECRET}"

  # 企业微信群机器人（群 → 群机器人 → 添加，复制 Webhook）
  wecom:
    webhook_url: "${WECOM_WEBHOOK_URL}"

  # 钉钉自定义机器人（群 → 智能群助手 → 添加机器人，复制 Webhook）
  dingtalk:
    webhook_url: "${DINGTALK_WEBHOOK_URL}"
    # 可选：机器人「安全设置」选择「加签」时填写
    secret: "${DINGTALK_SECRET}"

# ─── 输出配置 ─────────────────────────────────────────────────
output:
  dir: "output"
  # 生成 HTML 日报
  html: true
