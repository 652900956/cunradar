[project]
name = "cunradar"
version = "1.0.0"
description = "CunRadar - AI-powered Personal Information Radar"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pytz>=2024.0",
    "curl-cffi>=0.15.0",
]

[project.scripts]
cunradar = "cunradar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cunradar"]
