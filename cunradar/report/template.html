<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CunRadar Daily - 你的个人互联网信息雷达，AI 自动追踪 YouTube、B站、博客和 GitHub 更新。">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --fg: #e2e8f0;
    --fg-dim: #94a3b8;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.15);
    --green: #4ade80;
    --yellow: #fbbf24;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
  .header {
    text-align: center;
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .header .logo {
    width: 64px;
    height: 64px;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .date {
    color: var(--fg-dim);
    font-size: 1.1rem;
    margin-top: 8px;
  }
  .header .summary {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 16px;
    font-size: 0.9rem;
    color: var(--fg-dim);
  }
  .header .summary span { color: var(--accent); font-weight: 600; }
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .section h2 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section h2 .count {
    display: inline-block;
    background: var(--accent-glow);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 1px 10px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .author {
    background: rgba(15, 23, 42, 0.4);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 14px;
  }
  .author h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--fg);
  }
  .author h3 .count {
    display: inline-block;
    background: var(--accent-glow);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 20px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .author .items { margin-top: 4px; }
  .empty-state {
    text-align: center;
    color: var(--fg-dim);
    font-size: 0.9rem;
    padding: 24px 0;
  }
  .item {
    padding: 12px 0;
    border-bottom: 1px solid rgba(51, 65, 85, 0.5);
  }
  .item:last-child { border-bottom: none; }
  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .item-title {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  .item-title:hover { text-decoration: underline; }
  .time {
    color: var(--fg-dim);
    font-size: 0.8rem;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .meta {
    color: var(--fg-dim);
    font-size: 0.8rem;
    margin-top: 4px;
  }
  .desc {
    color: var(--fg-dim);
    font-size: 0.85rem;
    margin-top: 6px;
    line-height: 1.5;
  }
  .digest {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    line-height: 1.8;
  }
  .digest h2, .digest h3 {
    margin-top: 16px;
    margin-bottom: 8px;
    color: var(--yellow);
  }
  .digest h2:first-child, .digest h3:first-child { margin-top: 0; }
  .digest p { margin-bottom: 8px; color: var(--fg); }
  .digest li {
    margin-left: 20px;
    margin-bottom: 4px;
    color: var(--fg);
  }
  .footer {
    text-align: center;
    color: var(--fg-dim);
    font-size: 0.8rem;
    padding: 32px 0;
    border-top: 1px solid var(--border);
    margin-top: 32px;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 600px) {
    .container { padding: 16px 12px; }
    .header { padding: 32px 0 24px; }
    .header h1 { font-size: 1.5rem; }
    .section { padding: 16px; }
    .item-header { flex-direction: column; gap: 4px; }
    .time { white-space: normal; }
    .header .summary { flex-wrap: wrap; gap: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📡 CunRadar Daily</h1>
    <div class="date">{{DATE}}</div>
    <div class="summary">
      <span>{{SUMMARY_ITEMS}}</span> 条更新 · <span>{{SUMMARY_SOURCES}}</span> 个来源
    </div>
  </div>

  {{DIGEST}}

  {{SECTIONS}}

  <div class="footer">
    CunRadar · AI 个人信息雷达
    <br>
    Generated by <a href="https://github.com/652900956/CunRadar" target="_blank">CunRadar</a>
    · {{GENERATED_AT}}
  </div>
</div>
</body>
</html>
